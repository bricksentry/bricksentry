name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests with coverage (fails under 75%)
        run: pytest -q --cov --cov-report=term --cov-report=xml --cov-fail-under=75
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Run the agent-loop demo
        run: python examples/demo/agent_loop_demo.py > /dev/null

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the MCP server image
        run: docker build -f deploy/container/Dockerfile -t bricksentry-mcp:ci .
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id bricksentry-mcp:ci -un)" = bricksentry
      - name: Serves the MCP tools over stdio
        run: |
          printf 'sandbox_schema: scratch\nlineage: {type: static}\nbackend: {type: duckdb, path: ":memory:"}\n' > /tmp/bs.yml
          # Keep stdin open for a few seconds after the requests: closing it at once can stop
          # the server before it answers tools/list, which made this check flaky.
          { printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'; sleep 10; } \
            | timeout 60 docker run -i --rm -v /tmp/bs.yml:/config/bricksentry.yml:ro bricksentry-mcp:ci > /tmp/out.jsonl || true
          python3 - <<'PY'
          import json
          lines = [json.loads(l) for l in open("/tmp/out.jsonl") if l.strip()]
          tools = next(m["result"]["tools"] for m in lines if m.get("id") == 2)
          names = sorted(t["name"] for t in tools)
          print(names)
          assert {"whats_downstream", "preview_write", "safe_to_ship"} <= set(names), names
          PY
