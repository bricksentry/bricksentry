name: Feature request
description: Something bricksentry should check, support or do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What change slipped through, or what slowed your review down?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like bricksentry to do
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Data diff, Lineage / blast radius, Policy rules, preview_write, CI / GitHub, MCP / agents, New platform (AWS, Snowflake, ...), Other]
