[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "bricksentry"
version = "0.1.3"
description = "Change-safety for Databricks pipelines and the AI agents that edit them: data diffs, Unity Catalog blast radius, policy verdicts and rollback plans."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Brahma" }]
keywords = [
  "databricks", "delta-lake", "unity-catalog", "data-engineering", "data-diff",
  "lineage", "impact-analysis", "ci", "mcp", "ai-agents", "data-quality",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.30"]
duckdb = ["duckdb>=1.0"]
mcp = ["mcp>=1.10"]
all = ["databricks-sdk>=0.30", "duckdb>=1.0", "mcp>=1.10"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "duckdb>=1.0", "mcp>=1.10", "databricks-sdk>=0.30"]

[project.scripts]
bricksentry = "bricksentry.cli:entry"

[project.urls]
Homepage = "https://bricksentry.org"
Documentation = "https://bricksentry.org/docs"
Source = "https://github.com/bricksentry/bricksentry"
Issues = "https://github.com/bricksentry/bricksentry/issues"
Changelog = "https://github.com/bricksentry/bricksentry/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "action.yml"]

[tool.hatch.build.targets.wheel]
packages = ["src/bricksentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
builtins = ["dbutils", "spark", "display"]   # Databricks notebook globals

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["bricksentry"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402"]   # notebooks import after %pip install cells
