[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "bricksentry-mcp"
version = "0.1.11"
description = "MCP server for bricksentry: a safety check for AI agent and pipeline writes to Databricks tables. Installs bricksentry with its MCP and Databricks extras."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Brahma" }]
keywords = ["mcp", "databricks", "ai-agents", "data-quality", "unity-catalog", "delta-lake"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Operating System :: OS Independent",
]
dependencies = ["bricksentry[mcp,databricks]==0.1.11"]

[project.scripts]
bricksentry-mcp = "bricksentry_mcp:main"

[project.urls]
Homepage = "https://bricksentry.org"
Documentation = "https://bricksentry.org/docs/agents"
Source = "https://github.com/bricksentry/bricksentry"
Issues = "https://github.com/bricksentry/bricksentry/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bricksentry_mcp"]
